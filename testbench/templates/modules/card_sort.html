{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-ink">{{ conf.title }}</h1>
        <p class="text-ink-muted text-sm mt-1">{{ conf.instructions }}</p>
    </div>

    <div class="flex flex-col md:flex-row gap-6 items-start h-[70vh]">
        <!-- Unsorted Cards Pool -->
        <div class="w-full md:w-1/3 flex flex-col h-full bg-surface-subtle border border-line rounded-xl shadow-inner p-4 overflow-y-auto"
             id="card-pool"
             aria-label="Unsorted Cards Pool"
             ondrop="drop(event)" ondragover="allowDrop(event)">
            <h3 class="font-semibold text-ink mb-3 sticky top-0 bg-surface-subtle pb-2 border-b border-line flex items-center justify-between">
                <span>Unsorted Cards</span>
            </h3>
            
            <div id="cards-container" class="space-y-2.5">
                {% for card in conf.cards %}
                <div class="p-3 bg-card border border-line rounded-lg shadow-sm cursor-grab active:cursor-grabbing hover:border-brand/60 hover:shadow transition-all select-none text-ink text-sm font-medium"
                     draggable="true" tabindex="0" role="button" aria-grabbed="false"
                     ondragstart="drag(event)" 
                     id="card-{{ card.id }}" 
                     data-card-id="{{ card.id }}">
                    {{ card.label }}
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Categories Area -->
        <div class="w-full md:w-2/3 flex flex-col h-full">
            {% if conf.allow_new_categories %}
            <div class="mb-4 flex items-center gap-2">
                <input type="text" id="new-cat-name" aria-label="New Category Name" placeholder="New Category Name..." class="border border-line bg-card text-ink rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand/40 focus:border-brand flex-1 outline-none">
                <button type="button" aria-label="Add Category" onclick="addCategory()" class="inline-flex min-h-11 items-center justify-center gap-1.5 font-semibold rounded-lg text-sm px-4 py-2 border border-line bg-card text-ink hover:bg-surface-subtle focus:outline-none focus:ring-4 focus:ring-brand/30"><i class="fa-solid fa-plus text-xs" aria-hidden="true"></i>Add</button>
            </div>
            {% endif %}
            
            <div id="categories-container" class="flex-1 overflow-x-auto flex gap-4 pb-4">
                {% for cat in conf.categories %}
                <div class="min-w-[250px] max-w-[250px] flex flex-col bg-surface-subtle rounded-xl border border-line p-3 h-full">
                    <h3 class="font-semibold text-ink mb-2 truncate" title="{{ cat }}">{{ cat }}</h3>
                    <div class="flex-1 overflow-y-auto space-y-2.5 category-dropzone p-1 rounded-lg min-h-[120px]" 
                         data-category="{{ cat }}"
                         ondrop="drop(event)" ondragover="allowDrop(event)">
                        <!-- Cards dropped here -->
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="flex justify-end pt-4 border-t border-line">
        <button id="btn-done" type="button" class="inline-flex min-h-11 items-center justify-center gap-2 font-semibold rounded-lg text-[15px] px-8 py-2.5 text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-4 focus:ring-brand/30 disabled:opacity-40 disabled:cursor-not-allowed" onclick="submitSort()">Complete Sort</button>
    </div>
</div>

<script>
function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
    ev.target.classList.add("opacity-50");
}

document.addEventListener("dragend", function(ev) {
    ev.target.classList.remove("opacity-50");
});

function drop(ev) {
    ev.preventDefault();
    var data = ev.dataTransfer.getData("text");
    var el = document.getElementById(data);
    if (!el) return;
    
    var dropzone = ev.target.closest('.category-dropzone') || ev.target.closest('#cards-container') || ev.target.closest('#card-pool');
    if (dropzone) {
        if (dropzone.id === 'card-pool') {
            document.getElementById('cards-container').appendChild(el);
        } else {
            dropzone.appendChild(el);
        }
    }
}

function addCategory() {
    const input = document.getElementById('new-cat-name');
    const name = input.value.trim();
    if (!name) return;
    
    // Check if exists
    const existing = Array.from(document.querySelectorAll('.category-dropzone')).map(el => el.dataset.category);
    if (existing.includes(name)) {
        alert("Category already exists.");
        return;
    }
    
    const container = document.getElementById('categories-container');
    const col = document.createElement('div');
    col.className = 'min-w-[250px] max-w-[250px] flex flex-col bg-surface-subtle rounded-xl border border-line p-3 h-full';
    // Built with DOM calls, not innerHTML: the name is typed by the participant, and a quote in
    // it would break the data-category attribute the result is read from.
    const h = document.createElement('h3');
    h.className = 'font-semibold text-ink mb-2 truncate';
    h.title = name;
    h.textContent = name;
    const zone = document.createElement('div');
    zone.className = 'flex-1 overflow-y-auto space-y-2.5 category-dropzone p-1 rounded-lg min-h-[120px]';
    zone.dataset.category = name;
    zone.addEventListener('drop', drop);
    zone.addEventListener('dragover', allowDrop);
    col.append(h, zone);
    container.appendChild(col);
    input.value = '';
}

function submitSort() {
    const poolCards = document.querySelectorAll('#cards-container .p-3');
    if (poolCards.length > 0) {
        if (!confirm("You have unsorted cards. Are you sure you want to complete the task?")) {
            return;
        }
    }
    
    const result = {};
    document.querySelectorAll('.category-dropzone').forEach(dropzone => {
        const cat = dropzone.dataset.category;
        dropzone.querySelectorAll('[data-card-id]').forEach(card => {
            result[card.dataset.cardId] = cat;
        });
    });
    
    // Also mark pool cards as null/empty
    document.querySelectorAll('#card-pool > #cards-container > [data-card-id]').forEach(card => {
        result[card.dataset.cardId] = "";
    });
    
    const btn = document.getElementById('btn-done');
    btn.disabled = true;
    btn.textContent = "Saving...";
    
    fetch(window.location.href, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify(result)
    }).then(r => {
        if (r.ok) {
            window.location.href = r.url || window.location.href;
        } else {
            alert("Error saving.");
            btn.disabled = false;
            btn.textContent = "Complete Sort";
        }
    });
}
</script>
{% endblock %}
