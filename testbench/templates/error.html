{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block width %}max-w-lg{% endblock %}
{% block content %}
<div class="my-12 sm:my-20 text-center bg-card border border-line rounded-lg p-8 sm:p-10 ">
    <div class="size-16 bg-surface-subtle text-ink-subtle rounded-lg flex items-center justify-center mx-auto mb-5 text-2xl font-bold">
        {{ code }}
    </div>
    <h1 class="text-2xl font-bold text-ink mb-2 text-balance">{{ title }}</h1>
    <p class="text-ink-muted text-base leading-relaxed mb-6 text-pretty">{{ message }}</p>
    <a href="/" class="text-sm font-semibold text-brand underline">Back to the home page</a>
    {% if request_id %}
    <p class="text-xs text-ink-subtle mt-6">Reference: <code>{{ request_id }}</code></p>
    {% endif %}
</div>
{% endblock %}
