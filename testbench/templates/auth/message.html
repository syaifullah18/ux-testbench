{% extends "auth/_split.html" %}
{% block title %}{{ title }}{% endblock %}
{% block form %}
      <h1 class="t-page">{{ title }}</h1>
      <p class="mt-2 text-muted">{{ message }}</p>
      <div class="mt-8">
        {% if user %}
        <a href="{{ url_for('public.dashboard') }}" class="btn btn-primary">Back to studies</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to sign in</a>
        {% endif %}
      </div>
{% endblock %}
