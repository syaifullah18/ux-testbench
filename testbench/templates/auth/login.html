{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-14 border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
    <h1 class="text-xl font-bold text-slate-900 mb-1.5 text-center">Welcome back</h1>
    <p class="text-slate-500 text-[14px] mb-6 text-center">Log in to manage your projects.</p>
    
    <form method="post" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="lo-email">Email</label>
            <input id="lo-email" name="email" type="email" value="{{ form.email }}" required
                   class="w-full border {{ 'border-red-400' if errors.email else 'border-slate-300' }} rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand/40 focus:border-brand outline-none">
            {% if errors.email %}<p class="text-red-600 text-[13px] mt-1">{{ errors.email }}</p>{% endif %}
        </div>
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block text-sm font-medium text-slate-700" for="lo-pw">Password</label>
                <a href="{{ url_for('auth.forgot') }}" class="text-[12px] text-brand hover:underline">Forgot password?</a>
            </div>
            <input id="lo-pw" name="password" type="password" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-brand/40 focus:border-brand outline-none">
        </div>
        <button type="submit" class="w-full bg-brand text-white font-semibold py-2.5 rounded-lg hover:bg-brand/90 transition-colors mt-2">
            <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i>Log in
        </button>
    </form>
    
    <p class="text-center text-[14px] text-slate-500 mt-5">Don't have an account yet? <a href="{{ url_for('auth.signup') }}" class="text-brand hover:underline">Sign up</a></p>
</div>
{% endblock %}
