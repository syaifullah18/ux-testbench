{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-14 border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm text-center">
    <div class="size-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-envelope"></i>
    </div>
    <h1 class="text-xl font-bold text-slate-900 mb-2">Check your email</h1>
    <p class="text-slate-600 mb-6">We sent a verification link to <strong>{{ email }}</strong>. Please click the link to finish setting up your account.</p>
    <a href="{{ url_for('auth.login') }}" class="text-brand hover:underline font-medium">Return to login</a>
</div>
{% endblock %}
