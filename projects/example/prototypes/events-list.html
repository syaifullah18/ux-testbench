<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events · City Library</title>
<style>
  body { margin: 0; font-family: Georgia, serif; color: #222; background: #faf8f3; }
  header { background: #5b3a29; color: #fff; padding: 14px 20px; }
  header a { color: #f3e4d3; margin-right: 16px; font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 26px; }
  .event { border-bottom: 1px solid #ddd; padding: 16px 0; }
  .event h2 { font-size: 18px; margin: 0 0 4px; }
  .meta { color: #666; font-size: 14px; }
  details { margin-top: 6px; font-size: 14px; }
  summary { cursor: pointer; color: #5b3a29; }
</style>
</head>
<body>
<header><strong>City Library</strong> &nbsp; <a href="#">Home</a><a href="#">Catalogue</a><a href="#events">Events</a><a href="#">My account</a></header>
<main id="events">
  <h1>What's on in March</h1>
  <p>All events are free. Booking is required. Events are listed in order of date.</p>
  <div id="list"></div>
</main>
<script src="events.js"></script>
<script>
  document.getElementById('list').innerHTML = EVENTS.map(e => `
    <div class="event">
      <h2>${e.title}</h2>
      <div class="meta">${e.date} &middot; ${e.cat}</div>
      <p>${e.text}</p>
      <details><summary>More details</summary>
        <p>Day: ${e.day}. Seats remaining: ${e.seats === 0 ? 'none (waiting list)' : e.seats}. Venue: main building.</p>
        <p><a href="#">Book this event</a></p>
      </details>
    </div>`).join('');
</script>
</body>
</html>
